aid: primary
name: Primary
description: >-
  Primary (Primary Kids, Inc.) is a direct-to-consumer children's apparel brand
  selling simple, slogan-free, mix-and-match clothing "in all colors, for all
  kids" — babies through age 14, plus adult sizes, swimwear, school uniforms and
  licensed Sesame Street collaborations. The company operates a Shopify-hosted
  online store at primary.com and is a portfolio company of Homebrew. Primary has
  no first-party developer API, but its storefront is agent-accessible: it serves
  a live hosted Shopify Storefront MCP server (catalog search, product lookup,
  cart, checkout, policy/FAQ lookup) and exposes Shopify's Customer Account API
  (OAuth2/OIDC) for customer-scoped operations, along with a published llms.txt
  agent-instructions document.
