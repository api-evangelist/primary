  description: Look up a product by ID; pass options to select a specific variant for the product card.
- name: get_cart
  description: Get the cart including items, shipping options, discount info, and checkout URL for a given
    cart id.
- name: update_cart
  description: Add/remove/update line items, buyer info, shipping, discount codes, gift cards and notes
    in one consolidated call.
- name: search_shop_policies_and_faqs
  description: Get facts about the store's policies, products, or services.
